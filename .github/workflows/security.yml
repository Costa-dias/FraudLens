name: Security checks
on:
  pull_request:
  push:
    branches: ['main', 'security/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11.18'
      - run: python -m pip install --upgrade pip pip-audit pytest
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q server
      - run: python -m pytest server -q
      - run: python -m pip_audit -r requirements.txt
      - name: Bandit SAST (medium/high confidence)
        run: |
          python -m pip install 'bandit==1.8.6'
          python -m bandit -r server -q -ll -ii
