name: Propose tested security fixes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-fund
      - name: Apply semver-compatible security patches
        run: npm audit fix --no-fund || true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit only validated changes to isolated branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: apply automatically validated dependency and lint fixes'
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "HEAD:refs/heads/security/ci-audit-2026"
      - name: Confirm remaining known vulnerabilities
        run: npm audit --audit-level=high
