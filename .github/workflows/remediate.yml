name: Attempt safe npm remediation
on:
  push:
    paths:
      - .github/workflows/remediate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-fund
      - name: Update within compatible semver ranges only
        run: npm audit fix --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit only successful validated repair
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'security: apply tested compatible npm audit fixes'
            git push origin HEAD:security/ci-audit-2026
          fi
